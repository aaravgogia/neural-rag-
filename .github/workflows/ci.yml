name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Compile every backend module
        run: python -m compileall -q app
      - name: Run tests
        run: pytest tests/ -v

  backend-production-dependencies:
    name: Production dependency resolution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install production requirements in a clean runner environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-compile -r requirements.txt
          python -m pip check
      - name: Compile and import the production application without provider credentials
        env:
          HF_HUB_OFFLINE: '1'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
        run: |
          python -m py_compile $(find app -name '*.py' -print)
          python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend build and bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Report bundle budget
        shell: bash
        run: |
          total_bytes=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{total += $1} END {print total + 0}')
          preferred=$((1536 * 1024))
          egregious=$((4096 * 1024))
          total_mib=$(awk "BEGIN {printf \"%.2f\", $total_bytes / 1024 / 1024}")
          echo "JavaScript bundle: ${total_mib} MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$total_bytes" -gt "$preferred" ]; then
            echo "::warning::JavaScript bundle is ${total_mib} MiB, above the 1.5 MiB preferred budget."
          fi
          if [ "$total_bytes" -gt "$egregious" ]; then
            echo "::error::JavaScript bundle exceeds the 4 MiB hard limit."
            exit 1
          fi

  docker-demo:
    name: Docker demo backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo backend image
        run: docker build --file backend/Dockerfile.demo --tag neuralrag-demo-ci backend

  docker-production:
    name: Docker production backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image from fresh layers
        run: >-
          docker build --pull --no-cache
          --file backend/Dockerfile --tag neuralrag-production-ci backend

  docker-frontend:
    name: Docker frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: >-
          docker build --file frontend/Dockerfile
          --build-arg VITE_API_URL=http://localhost:8000
          --build-arg VITE_WS_URL=ws://localhost:8000
          --tag neuralrag-frontend-ci frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neuralrag-frontend-ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  frontend-unit:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run test:unit

  playwright-e2e:
    name: Playwright live-demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-demo.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install demo backend dependencies
        working-directory: backend
        run: pip install -r requirements-demo.txt
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start demo backend and static frontend
        run: |
          (cd backend && uvicorn app.main_demo:app --host 127.0.0.1 --port 8000 > ../demo-backend.log 2>&1 &)
          (cd frontend && npx serve -s dist -l 4173 > ../frontend-preview.log 2>&1 &)
      - name: Wait for services
        run: |
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8000/ && break || sleep 1; done
          curl --fail http://127.0.0.1:8000/
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ && break || sleep 1; done
          curl --fail http://127.0.0.1:4173/
      - name: Run live-demo browser smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-service-logs
          path: |
            demo-backend.log
            frontend-preview.log
