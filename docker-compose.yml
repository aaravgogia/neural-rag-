version: '3.9'

services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres/ragdb
      REDIS_URL: redis://redis:6379
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-chroma}
      ENVIRONMENT: development
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: arq app.core.ingestion.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres/ragdb
      REDIS_URL: redis://redis:6379
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-chroma}
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    # Includes the PostgreSQL 16 pgvector extension. It remains compatible
    # with Chroma mode and enables VECTOR_STORE_PROVIDER=pgvector locally.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
      POSTGRES_DB: ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
