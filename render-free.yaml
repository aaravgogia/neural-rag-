# $0 deployment: Render free API + Neon Postgres + Upstash Redis + Vercel UI.
# The existing render.yaml remains the independent zero-credential public demo.
services:
  - type: web
    name: neuralrag-free-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /status
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: mistral
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: EMBEDDING_PROVIDER
        value: sentence_transformers
      # Persist vectors in Neon, rather than ephemeral Chroma in Render.
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: PGVECTOR_DIMENSIONS
        value: "384"
      # No dedicated worker exists on the free stack. Uploads run inline.
      - key: INGESTION_QUEUE_ENABLED
        value: "false"
      - key: WS_REDIS_BROADCAST_ENABLED
        value: "true"
      - key: PII_REDACTION_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
